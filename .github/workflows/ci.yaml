name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [macos-13, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
